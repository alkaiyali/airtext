name = "airtext"
main = "worker/index.ts"
compatibility_date = "2026-08-14"
workers_dev = false

[[routes]]
pattern = "airtext.alkaiyali.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Serve assets through the Worker so SECURITY_HEADERS (X-Frame-Options,
# Referrer-Policy, …) apply to every response; asset-layer serving skips it.
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = []
