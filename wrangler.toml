name = "airtext"
main = "worker/index.ts"
compatibility_date = "2026-08-14"
workers_dev = false

[[routes]]
pattern = "airtext.alkaiyali.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Only the relay needs the Worker. Everything else is served by the asset
# layer, which is free and unmetered; security headers for those responses
# come from public/_headers. Unmatched paths (bot probes for /wp-login.php,
# /.env, …) get the 404 page without invoking the Worker.
run_worker_first = ["/room/*"]
not_found_handling = "404-page"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Limiter"]

[[migrations]]
tag = "v3"
new_sqlite_classes = []
